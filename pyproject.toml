[project]
name = "clrs-implementations"
version = "0.1.0"
description = "Implementations of algorithms from CLRS, Introduction to Algorithms, 4th Edition" 
authors = [{ name = "Lajos Répási" }]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pylint>=3.0",
    "jsonpickle>=4.1.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/clrs"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
